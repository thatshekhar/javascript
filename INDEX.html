<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Welcome to My Form</h1>
    <p>This is a sample HTML page.</p>
    <form >
        ,
        <label for="name">Name:</label>
        <input id="name" type="text" placeholder="Enter your name" required><br>
        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter your email" required> <br>
        <label for="message">Message:</label>
        <input id="message" placeholder="Enter your message" required></input> <br>
        <label for = "tel">Phone:</label>
        <input id="tel" type="tel" pattern="[0-9]{10}" placeholder="Enter your phone number" required> <br>
        <label for="age">Age:</label>
        <input id="age" type="number" placeholder="Enter your age" required> <br>
        <label for="date">Date:</label>
        <input id="date" type="date" min="2026-08-02" max="2027-01-01" placeholder="Enter date" required> <br>
        <label for="color">Favorite Color:</label>
        <input id="color" type="color" required> <br>
        <label for="url">URL:</label>
        <input id="url" type="url" placeholder="Enter your URL" > <br>
        <label for="password">Password:</label>
        <input id="password" type="password" placeholder="Enter your password"> <br>
        <label for="file">Upload File:</label>
        <input id="file" type="file" accept=".pdf,.doc,.docx" multiple placeholder="Upload a file" > <br>
        <label for="male">Male:</label>
        <input type="radio" id="male" name="gender"><br>
        <label for="female">Female:</label>
        <input type="radio" id="female" name="gender"><br>
        <label for="other">Other:</label>
        <input type="radio" id="other" name="gender"><br>
      <input type="submit" value="Submit">
    </form>
 </body>
  </html>
